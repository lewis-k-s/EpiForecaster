# Matched real-data fine-tuning treatment for the reporting-v1 pretraining
# study. Copy this template and set training.init_checkpoint to the absolute
# GPFS checkpoint from the accepted corrected-corpus pretraining run.
#
# This template deliberately matches mn5_synth_pretrain_control.yaml in real
# data, seed, architecture, schedule, evaluation, and resources. Only the
# experiment identity and pinned initialization checkpoint may differ.

run: {}
source: {}
container: {}

workflow:
  kind: train
  target: train_evaluate

dvc:
  targets:
    - data/files/mobility.zarr.dvc
    - data/processed/real_with_id.zarr.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc

training:
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  experiment_name: synthetic-pretraining-finetune-reporting-v1
  model_id: model
  max_batches: null
  require_init_checkpoint: true
  init_checkpoint: null
  overrides:
    - output.save_checkpoints=true
    - training.run_final_evaluation=false

evaluation:
  split: test
  granular: true
  overrides:
    - training.val_workers=2

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 420
