# Immutable full-corpus preprocessing for the 200-run closed-loop reactive
# corpus epiforecaster_sirhd_v1_netcdf_d9c5bae_20261015_reactive_n100. The run
# publishes a new DVC object and leaves the generated pointer in its immutable
# publication directory for reviewed promotion to this repository.
#
# Before preparing this run, the raw object a30e21844967255fa43a15157e49ccfa
# must be present in EpiForecaster-DVC/storage on GPFS. Hard-link it from the
# EpiSim.jl DVC store; do not route the 134 GB payload through a workstation.
#
# The generator bundle has no handoff_manifest.json, so this run cannot assert
# generator QA or per-run seed vectors. The raw pointer pins content by MD5 and
# preprocessing pins the embedded state-space contract by SHA-256.
#
# Runtime is dominated by dense time-varying mobility (200 x 455 x 945 x 945
# float32, ~325 GB uncompressed): read, log1p, write, post-write verification,
# and publication hashing/copying. 600 minutes leaves margin over the ~3-4 h
# estimate; completed attempts are restored on retry.

run: {}
source: {}
container: {}

workflow:
  kind: preprocess
  target: preprocess

dvc:
  targets:
    - data/files/epiforecaster_sirhd_v1_netcdf_d9c5bae_reactive_n100.nc.dvc
    - data/files/catalonia_preprocessing_inputs_v1.dvc
  provenance_targets: []

preprocessing:
  base_config: configs/production_only/preprocess_mn5_synth_sirhd_v1_reactive_n100.yaml
  dataset_name: synthetic_sirhd_v1_d9c5bae_reactive_n100_holt_damped
  expected_run_count: 200
  required_variables:
    - cases
    - hospitalizations
    - deaths
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true
  float32_variables:
    - cases
    - hospitalizations
    - deaths
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true
  nonnegative_variables:
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 600
