extends:
- workflow/config/profiles/native_inputs.yaml
- workflow/config/profiles/acc.yaml
workflow:
  kind: train
  target: train
training:
  base_config: configs/train_epifor_smoke.yaml
  model_id: model
  overrides:
  - training.device=cuda
  - training.enable_mixed_precision=true
  - output.save_checkpoints=true
  - output.write_granular_eval=true
  - output.granular_eval_format=parquet
evaluation:
  split: test
  granular: true
variants:
  abs_excess_smoke:
    training:
      experiment_name: native_abs_excess_smoke
      max_batches: 4
      overrides:
      - training.epochs=1
      - training.max_batches=4
      - training.batch_size=32
      - training.num_workers=4
      - training.val_workers=2
      - training.test_workers=2
      - training.persistent_workers=true
      - training.prefetch_factor=2
      - native.spatial_encoder=hetero
      - native.fold_index=0
    evaluation:
      overrides:
      - training.max_batches=null
    resources:
      allocation:
        partition: acc
        qos: acc_debug
        runtime: 60
  abs_excess_vax_1ep_interactive:
    training:
      experiment_name: native_abs_excess_vax_1ep
      max_batches: null
      overrides:
      - training.epochs=1
      - training.max_batches=null
      - training.batch_size=32
      - training.num_workers=4
      - training.val_workers=2
      - training.test_workers=2
      - training.persistent_workers=true
      - training.prefetch_factor=2
      - native.spatial_encoder=hetero
      - native.include_vaccination=true
      - native.fold_index=0
    evaluation:
      overrides:
      - training.max_batches=null
    resources:
      allocation:
        partition: accinteractive
        qos: acc_interactive
        runtime: 100
  abs_excess_vax_20ep_debug:
    training:
      experiment_name: native_abs_excess_vax_20ep
      max_batches: null
      overrides:
      - training.epochs=20
      - training.max_batches=null
      - training.batch_size=64
      - training.num_workers=4
      - training.val_workers=2
      - training.test_workers=2
      - training.persistent_workers=true
      - training.prefetch_factor=2
      - native.spatial_encoder=hetero
      - native.include_vaccination=true
      - native.fold_index=0
    evaluation:
      overrides:
      - training.max_batches=null
    resources:
      allocation:
        partition: acc
        qos: acc_debug
        runtime: 120
  abs_excess_vax_60_28_10ep_debug:
