workflow:
  kind: train
  target: train
training:
  base_config: configs/train_epifor_smoke.yaml
  experiment_name: native_perf_b32_400x3
  model_id: model
  max_batches: 400
  overrides:
  - training.device=cuda
  - training.epochs=3
  - training.max_batches=400
  - training.batch_size=32
  - training.num_workers=4
  - training.val_workers=2
  - training.test_workers=2
  - training.persistent_workers=true
  - training.prefetch_factor=2
  - training.enable_mixed_precision=true
  - native.spatial_encoder=hetero
  - native.include_vaccination=true
  - native.fold_index=0
  - output.save_checkpoints=true
  - output.write_granular_eval=false
  - output.granular_eval_format=parquet
  - model.input_window_length=60
  - model.forecast_horizon=28
evaluation:
  split: test
  granular: false
  overrides:
  - training.max_batches=null
resources:
