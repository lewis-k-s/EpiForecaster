run: {}
source: {}
container: {}
workflow:
  kind: train
  target: train_evaluate
dvc:
  targets:
  - data/files/mobility.zarr.zip.dvc
  - data/processed/real_with_id.zarr.zip.dvc
  - outputs/region_embeddings/region_embeddings.pt.dvc
training:
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  experiment_name: integration-dev-ft-betaonly
  model_id: model
  max_batches: null
  overrides:
  - output.save_checkpoints=true
  - training.run_final_evaluation=false
  - training.seed=43
  - model.sir_physics.time_varying_rates=beta
  - training.loss.joint.beta_smoothness_weight=10.0
  require_init_checkpoint: true
  init_checkpoint: /gpfs/projects/bsc08/shared_projects/MePreCiSa/EpiForecaster/EpiForecaster-DVC/runs/synth-pretrain-5a2262d-n400-e10-20261106/outputs/training/synthetic-pretrain-sirhd-v1-reactive-n400/model/checkpoints/best_model.pt
evaluation:
  split: test
  granular: true
  overrides:
  - training.val_workers=2
resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 60
