# Integration dev campaign (configs/campaigns/integration_dev_v1.yaml): 8
# conditions x 5 paired seeds = 40 identities, packed as 8 workers on 4 GPUs
# (2 CUDA MPS clients per GPU) in one 2 h acc_debug allocation. A single
# 50-epoch trial took 7.4-11.6 min alone on one GPU, so 5 waves fit.
# Trials still running at close-out finish within the 15 min signal lead;
# resubmitting the same run continues any remaining identities.

run: {}
source: {}
container: {}

workflow:
  kind: ablation
  target: ablation

dvc:
  targets:
    - data/files/mobility.zarr.zip.dvc
    - data/processed/real_with_id.zarr.zip.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc

ablation:
  study_name: epiforecaster_integration_dev_v1
  campaign: configs/campaigns/integration_dev_v1.yaml
  workers: 8
  closeout_signal_seconds: 900
  timeout_s: 6300
  sampler_seed: 42
  smoketest: false
  recover_stale_running: true
  requeue_running: false

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_debug
    nodes: 1
    tasks: 8
    cpus_per_task: 10
    gres: gpu:4
    mps_clients_per_gpu: 2
    runtime: 120
