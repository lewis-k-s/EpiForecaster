# Declarative paired-seed campaign. Workers coordinate its fixed identity matrix
# through JournalStorage; Optuna never samples ablation design parameters.

run: {}
source: {}
container: {}

workflow:
  kind: ablation
  target: ablation

dvc:
  targets:
    - data/files/mobility.zarr.dvc
    - data/processed/real_with_id.zarr.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc

ablation:
  study_name: epiforecaster_ablation_v1
  campaign: configs/campaigns/ablation_default_v1.yaml
  workers: 4
  # Four workers need the full 1,400-identity matrix; retain one hour for finalization.
  timeout_s: 165600
  sampler_seed: 42
  smoketest: false
  requeue_running: false

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 4
    cpus_per_task: 20
    gres: gpu:4
    runtime: 2880
