# Single-model training from the selected parameters of
# epiforecaster_probabilistic_hpo_v1 trial 37. The original selection is
# recorded under immutable run
# probabilistic-hpo-nll-sif-eaf0534-20260723T153559Z.
#
# The selected data.mobility_threshold=1.0 parameter predates the raw-flow
# contract cutover and is expressed here as data.mobility_min_flow_raw=1.0.
# Per-run paths and provenance fields are injected by mn5_workflow.sh.

run: {}
source: {}
container: {}

workflow:
  kind: train
  target: train

dvc:
  targets:
    - data/files/mobility.zarr.dvc
    - data/processed/real_with_id.zarr.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc

provenance:
  training_evidence_retention: dvc

training:
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  experiment_name: hpo37-profiled-interactive
  model_id: model
  max_batches: null
  overrides:
    - data.mobility_min_flow_raw=1.0
    - data.sample_ordering=node
    - model.gnn_depth=2
    - model.gnn_module=gat
    - model.mobility_embedding_dim=128
    - model.observation_heads.delta_forecasting=true
    - model.observation_heads.residual_hidden_dim=64
    - training.learning_rate=0.0010875169937964292
    - training.weight_decay=1.4258706676899107e-07
    - training.epochs=10
    - training.progress_log_frequency=10
    - training.grad_norm_log_frequency=20
    - training.profiler.enabled=true
    - training.profiler.wait_steps=5
    - training.profiler.warmup_steps=1
    - training.profiler.active_steps=2
    - training.profiler.repeat=1
    - training.profiler.profile_epochs=[1,5]
    - training.profiler.record_memory=false
    - training.profiler.with_stack=false
    - output.save_checkpoints=true
    - training.run_final_evaluation=false

evaluation:
  split: test
  granular: true
  overrides:
    - training.val_workers=2

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 45
