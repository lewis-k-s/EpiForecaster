# Immutable full-corpus preprocessing for the 200-run closed-loop reactive
# corpus epiforecaster_sirhd_v1_netcdf_b354b27_20261015_reactive_n100. The run
# publishes a new DVC object and leaves the generated pointer in its immutable
# publication directory for reviewed promotion to this repository.
#
# The raw object a5a2ba99cd5c154353c368b33b73dea0 is hard-linked from the
# EpiSim.jl DVC store into EpiForecaster-DVC/storage on GPFS (no copy).
#
# The generator handoff has qa_passed=false. Preprocessing accepts it only with
# the committed owner waiver, which must name this handoff SHA-256 and exactly
# its failed gates. Run IDs and seed vectors are checked against the handoff.
#
# Mobility is rebuilt lazily from the factorized layout; I/O is of the same
# order as the dense d9c5bae run (200 x 455 x 945 x 945 float32 rebuilt and
# written, plus the parity sample read from mobility_time_varying). Run the
# bounded mn5_preprocess_b354b27_mobility_parity.yaml first.

run: {}
source: {}
container: {}

workflow:
  kind: preprocess
  target: preprocess

dvc:
  targets:
    - data/files/epiforecaster_sirhd_v1_netcdf_b354b27_reactive_n100.nc.dvc
    - data/files/catalonia_preprocessing_inputs_v1.dvc
  provenance_targets: []

preprocessing:
  base_config: configs/production_only/preprocess_mn5_synth_sirhd_v1_b354b27_reactive_n100.yaml
  dataset_name: synthetic_sirhd_v1_b354b27_reactive_n100_holt_damped
  expected_run_count: 200
  handoff_manifest: data/files/epiforecaster_sirhd_v1_netcdf_b354b27_reactive_n100_qa/handoff_manifest.json
  handoff_qa_acceptance: data/files/epiforecaster_sirhd_v1_netcdf_b354b27_reactive_n100_qa/qa_acceptance.json
  required_variables:
    - cases
    - hospitalizations
    - deaths
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true
  float32_variables:
    - cases
    - hospitalizations
    - deaths
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true
  nonnegative_variables:
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 600
