extends:
- workflow/config/profiles/native_inputs.yaml
- workflow/config/profiles/acc.yaml
workflow:
  kind: hpo
  target: hpo
optuna:
  study_name: epiforecaster_native_hpo_v1
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  workers: 4
  trials_per_worker: 10
  timeout_s: 17100
  epochs: 20
  max_batches: null
  seed: 42
  sampler: tpe
  pruning_start_epoch: 10
  search_space: default
  sample_training_loss_objective: false
  overrides:
  - training.run_final_evaluation=false
evaluation:
  split: test
  granular: true
  overrides:
  - training.val_workers=2
promotion:
  root: /gpfs/projects/bsc08/shared_projects/MePreCiSa/EpiForecaster/EpiForecaster-DVC/promoted
resources:
  allocation:
    qos: acc_bscls
    tasks: 4
    gres: gpu:4
    runtime: 420
