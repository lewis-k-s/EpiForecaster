# Canonical synthetic-pretraining MN5 workflow for the corrected continuous
# SIRHD reporting-v1 corpus. Per-run paths and provenance fields are injected
# by scripts/workflow/mn5_workflow.sh.

run: {}
source: {}
container: {}

workflow:
  kind: train
  target: train_evaluate

dvc:
  targets:
    - data/processed/synthetic_sirhd_reporting_v1_cb6b4e5_holt_damped_latent_flow_v2.zarr.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc
  provenance_targets:
    - data/files/raw_synthetic_observations_sirhd_reporting_v1_cb6b4e5.zarr.dvc

training:
  base_config: configs/production_only/train_epifor_mn5_synth_pretrain.yaml
  experiment_name: synthetic-pretrain-sirhd-reporting-v1
  model_id: model
  max_batches: null
  overrides:
    - output.save_checkpoints=true
    - training.run_final_evaluation=false
    # One epoch is 419,825 examples (13,119 production batches). The compiled
    # smoke measured ~18.4 minutes/epoch, so ten epochs form the first bounded
    # pretraining cycle before deciding whether a longer continuation is useful.
    - training.epochs=10

evaluation:
  split: test
  granular: true
  overrides:
    - training.val_workers=2

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 420
