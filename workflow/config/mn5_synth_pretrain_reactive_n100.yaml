# Synthetic-pretraining MN5 workflow for the 200-run closed-loop reactive
# a97c812 corpus. Per-run paths and provenance fields are injected by
# scripts/workflow/mn5_workflow.sh. The processed pointer is published by
# mn5_preprocess_sirhd_v1_a97c812_reactive_n100.yaml and must be promoted into
# data/processed/ before this workflow is prepared.
#
# Measured in sizing run synth-sizing-a97c812-20261103 (job 48428830), with the
# block pipeline of the base config (blocks of 8 runs, 4 builder processes):
#   - peak host RSS 36.2 GB, peak GPU memory 16.8 GB;
#   - staging and setup about 5 min, light build of all runs about 95 s, the
#     first block about 25 s;
#   - training at about 97 batches/s including block switches (about 90
#     batches/s sustained over a full epoch in job 48429417);
#   - one validation pass about 1.5 min.
# An epoch is 165,825 batches, about 31 min. Four epochs plus the test
# evaluation take about 2 h 20 min, longer than the 2 h acc_debug limit: the
# first run completes three epochs and a continuation run from its last epoch
# checkpoint trains the fourth and evaluates (docs/MN5_SNAKEMAKE.md, "Training
# continuation").

run: {}
source: {}
container: {}

workflow:
  kind: train
  target: train_evaluate

dvc:
  targets:
    - data/processed/synthetic_sirhd_v1_a97c812_reactive_n100_holt_damped.zarr.zip.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc
  provenance_targets:
    - data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip.dvc

training:
  base_config: configs/production_only/train_epifor_mn5_synth_pretrain_reactive_n100.yaml
  experiment_name: synthetic-pretrain-sirhd-v1-reactive-n100
  model_id: model
  max_batches: null
  overrides:
    - output.save_checkpoints=true
    - training.run_final_evaluation=false
    - output.checkpoint_frequency=1

evaluation:
  split: test
  granular: true
  overrides:
    - training.val_workers=2

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_debug
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 120
