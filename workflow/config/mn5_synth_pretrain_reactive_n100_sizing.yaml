# Bounded sizing run for the production a97c812 reactive pretraining. It keeps
# every production setting (compilation, loaders, profiler) and caps training
# at max_batches, which also limits the run to one epoch. Validation is not
# capped, so the log records:
#   - dataset construction time and peak host RSS for all 200 runs;
#   - steady-state compiled training throughput (SPS in the progress log);
#   - one full validation pass.
# Size the production runtime from these numbers. An epoch is about 131k
# training batches.
extends: mn5_synth_pretrain_reactive_n100.yaml

workflow:
  target: train

training:
  experiment_name: synthetic-pretrain-sirhd-v1-a97c812-reactive-n100-sizing
  max_batches: 6000

resources:
  allocation:
    qos: acc_debug
    runtime: 110
