# Fixed full-spatial-coverage loss campaign. Reuse one compatible ACC allocation,
# then resume this immutable queue through rolling acc_interactive sessions.
run: {}
source: {}
container: {}

workflow:
  kind: ablation
  target: ablation

dvc:
  targets:
    - data/files/mobility.zarr.dvc
    - outputs/loss_research/loss-type-research-v1/real_loss_fit20200930_v1.nc.dvc
    - outputs/region_embeddings_no_mobility/region_embeddings.pt.dvc

ablation:
  study_name: loss_type_full_coverage_v2
  campaign: configs/campaigns/loss_type_full_coverage_v2.yaml
  workers: 2
  reuse_receipt: configs/research/loss_type_full_coverage_v2_reuse.json
  recover_stale_running: true
  reuse_evidence_dir: /gpfs/projects/bsc08/shared_projects/MePreCiSa/EpiForecaster/EpiForecaster-DVC/reuse-evidence/loss-type-full-coverage-v2/v1
  # Reserve 20 minutes for the active identities and finalization in each rolling allocation.
  closeout_signal_seconds: 1200
  timeout_s: 6000
  sampler_seed: 52
  smoketest: false
  requeue_running: false

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_interactive
    nodes: 1
    tasks: 2
    cpus_per_task: 20
    gres: gpu:2
    runtime: 120
