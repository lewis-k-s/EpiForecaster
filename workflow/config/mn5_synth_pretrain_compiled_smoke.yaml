# Production-shaped, allocation-attached smoke cycle for corrected continuous
# SIRHD reporting-v1 pretraining. It retains the canonical batch size and
# torch.compile settings while bounding training to enough steps to exercise
# compilation and pathway probes.

run: {}
source: {}
container: {}

workflow:
  kind: train
  target: train

dvc:
  targets:
    - data/processed/synthetic_sirhd_reporting_v1_cb6b4e5_holt_damped_latent_flow_v2.zarr.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc
  provenance_targets:
    - data/files/raw_synthetic_observations_sirhd_reporting_v1_cb6b4e5.zarr.dvc

training:
  base_config: configs/production_only/train_epifor_mn5_synth_pretrain.yaml
  experiment_name: synthetic-pretrain-sirhd-reporting-v1-compiled-smoke
  model_id: model
  max_batches: 20
  overrides:
    - output.save_checkpoints=true
    - training.run_final_evaluation=false
    - training.epochs=1
    - training.profiler.enabled=false
    - training.progress_log_frequency=1
    - training.grad_norm_log_frequency=10
    - training.pathway_gradient_frequency=10

evaluation:
  split: test
  granular: true
  overrides:
    - training.val_workers=2

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_debug
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 30
