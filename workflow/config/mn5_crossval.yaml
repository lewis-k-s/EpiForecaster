extends:
- workflow/config/profiles/native_inputs.yaml
- workflow/config/profiles/acc.yaml
workflow:
  kind: crossval
  target: crossval
crossval:
  campaign_id: epiforecaster-native-10fold-v4
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  folds: 10
  model_seed: 42
  holdout_role: test
  max_batches: null
  overrides:
  - output.save_checkpoints=true
  - training.run_final_evaluation=false
evaluation:
  split: test
  granular: true
  overrides:
  - training.val_workers=2
resources:
  allocation:
    qos: acc_bscls
    tasks: 4
    gres: gpu:4
    runtime: 420
