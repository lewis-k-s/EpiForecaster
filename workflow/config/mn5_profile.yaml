extends:
- workflow/config/profiles/native_inputs.yaml
- workflow/config/profiles/acc.yaml
workflow:
  kind: train
  target: train
provenance:
  training_evidence_retention: dvc
training:
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  experiment_name: native-profile
  model_id: model
  max_batches: null
  overrides:
  - model.observation_heads.delta_forecasting=true
  - model.observation_heads.residual_hidden_dim=64
  - training.learning_rate=0.0010875169937964292
  - training.weight_decay=1.4258706676899107e-07
  - training.epochs=10
  - training.progress_log_frequency=10
  - training.grad_norm_log_frequency=20
  - training.profiler.enabled=true
  - training.profiler.wait_steps=5
  - training.profiler.warmup_steps=1
  - training.profiler.active_steps=2
  - training.profiler.repeat=1
  - training.profiler.profile_epochs=[1,5]
  - training.profiler.record_memory=false
  - training.profiler.with_stack=false
  - output.save_checkpoints=true
  - training.run_final_evaluation=false
evaluation:
  split: test
  granular: true
  overrides:
  - training.val_workers=2
resources:
  allocation:
    qos: acc_bscls
    runtime: 45
