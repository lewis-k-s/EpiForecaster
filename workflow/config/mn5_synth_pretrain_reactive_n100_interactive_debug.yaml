# Short, allocation-attached debug run for the 200-run a97c812 reactive corpus.
# It uses the production loader settings (batch size, workers, prefetch) so the
# progress log measures data-loader throughput from the node-local input copy.
# max_batches limits the run to one epoch.
# Compilation and the profiler are off to keep the run short. Per-run paths and
# provenance fields are injected by mn5_workflow.sh.

run: {}
source: {}
container: {}

workflow:
  kind: train
  target: train

dvc:
  targets:
    - data/processed/synthetic_sirhd_v1_a97c812_reactive_n100_holt_damped.zarr.zip.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc
  provenance_targets:
    - data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip.dvc

training:
  base_config: configs/production_only/train_epifor_mn5_synth_pretrain_reactive_n100.yaml
  experiment_name: synthetic-pretrain-sirhd-v1-a97c812-reactive-n100-interactive-debug
  model_id: model
  max_batches: 300
  overrides:
    - output.save_checkpoints=true
    - training.run_final_evaluation=false
    - training.compile=false
    - training.compile_backward=false
    - training.profiler.enabled=false
    - training.progress_log_frequency=20

# Required by the train contract; unused because the target is train only.
evaluation:
  split: test
  granular: false
  overrides: []

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_debug
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 100
