# Bounded single-model acceptance for all Gamma observation kernels.
# Per-run paths and provenance fields are injected by the workflow launcher.
extends: mn5_train_smoke.yaml

training:
  experiment_name: all-gamma-observation-smoke
  overrides:
    - model.observation_heads.kernel_parameterization_ww=gamma
    - model.observation_heads.kernel_length_ww=35
    - model.observation_heads.kernel_parameterization_hosp=gamma
    - model.observation_heads.kernel_parameterization_cases=gamma
    - model.observation_heads.kernel_parameterization_deaths=gamma
    - model.observation_heads.learnable_kernel_ww=true
    - model.observation_heads.learnable_kernel_hosp=true
    - model.observation_heads.learnable_kernel_cases=true
    - model.observation_heads.learnable_kernel_deaths=true
    - output.save_checkpoints=true
    - training.run_final_evaluation=false
    - training.compile=false
    - training.profiler.enabled=false
    - training.num_workers=1
    - training.val_workers=1
    - training.test_workers=1

resources:
  allocation:
    runtime: 50
