extends:
- workflow/config/profiles/native_inputs.yaml
- workflow/config/profiles/acc.yaml
workflow:
  kind: ablation
  target: ablation
ablation:
  study_name: epiforecaster_native_ablation_smoke_v1
  campaign: configs/campaigns/ablation_smoke_v1.yaml
  workers: 2
  trials_per_worker: 4
  closeout_signal_seconds: 300
  timeout_s: 3300
  sampler_seed: 42
  smoketest: true
  requeue_running: false
resources:
  allocation:
    qos: acc_bscls
    tasks: 2
    gres: gpu:2
    runtime: 60
