# Lightweight end-to-end acceptance configuration. Per-run paths and
# provenance fields are injected by scripts/workflow/mn5_workflow.sh.

run: {}
source: {}
container: {}

workflow:
  kind: hpo
  target: hpo

dvc:
  targets:
    - data/files/mobility.zarr.dvc
    - data/processed/real_with_id.zarr.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc

optuna:
  study_name: epiforecaster_hpo_smoke_v1
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  workers: 4
  trials_per_worker: 1
  timeout_s: 900
  epochs: 1
  max_batches: 1
  seed: 42
  sampler: tpe
  pruning_start_epoch: 10
  search_space: default
  sample_training_loss_objective: false
  overrides:
    - training.run_final_evaluation=false

evaluation:
  split: test
  granular: true
  overrides:
    - training.val_workers=2

promotion:
  root: /gpfs/projects/bsc08/shared_projects/MePreCiSa/EpiForecaster-DVC/promoted

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 4
    cpus_per_task: 20
    gres: gpu:4
    runtime: 60
