# Corrected-corpus synthetic held-out cross-evaluation of the matched real-data
# control. This is prepared for use only after the training/evaluation pause is
# explicitly released.
#
# The evaluation checkpoint is copied into the immutable run during prepare.
# Enabling the synthetic-only curriculum dataset path reproduces the seed-42
# node split over the corrected 20-run reporting-v1 corpus.

run: {}
source: {}
container: {}

workflow:
  kind: evaluate
  target: evaluate

dvc:
  targets:
    - data/processed/synthetic_sirhd_reporting_v1_cb6b4e5_holt_damped_latent_flow_v2.nc.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc
  provenance_targets:
    - data/files/raw_synthetic_observations_sirhd_reporting_v1_cb6b4e5.zarr.dvc

evaluation:
  checkpoint: /gpfs/projects/bsc08/shared_projects/MePreCiSa/EpiForecaster/EpiForecaster-DVC/runs/synth-control-seed42-dfadab4-20260725T214049Z/outputs/training/synthetic-pretraining-control/model/checkpoints/best_model.pt
  split: test
  granular: true
  overrides:
    - data.dataset_path=data/processed/synthetic_sirhd_reporting_v1_cb6b4e5_holt_damped_latent_flow_v2.nc
    - data.mobility_min_flow_raw=0.0
    - data.run_id_chunk_size=1
    - training.curriculum.enabled=true
    - training.loss.joint.latent.total_weight=0.0
    - training.val_workers=2

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 420
