# Primary single-model MN5 workflow. Per-run paths and provenance fields are
# injected by scripts/workflow/mn5_workflow.sh.

run: {}
source: {}
container: {}

workflow:
  kind: train
  target: train

dvc:
  targets:
    - data/files/mobility.zarr.dvc
    - data/processed/real_with_id.zarr.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc

training:
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  experiment_name: single
  model_id: model
  max_batches: null
  overrides:
    - output.save_checkpoints=true
    - training.run_final_evaluation=false

evaluation:
  split: test
  granular: true
  overrides:
    - training.val_workers=2

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 420
