# Smoke validation of NetCDF4 raw synthetic input through the preprocessing pipeline.

run: {}
source: {}
container: {}

workflow:
  kind: preprocess
  target: preprocess

dvc:
  targets:
    - data/files/epiforecaster_sirhd_v1_netcdf_c3d4810_smoke_2run.nc.dvc
    - data/files/catalonia_preprocessing_inputs_v1.dvc
  provenance_targets: []

preprocessing:
  base_config: configs/production_only/preprocess_mn5_synth_netcdf_smoke.yaml
  dataset_name: synthetic_netcdf_smoke_2run
  expected_run_count: 2
  required_variables:
    - cases
    - hospitalizations
    - deaths
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true
  float32_variables:
    - cases
    - hospitalizations
    - deaths
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true
  nonnegative_variables:
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 30
