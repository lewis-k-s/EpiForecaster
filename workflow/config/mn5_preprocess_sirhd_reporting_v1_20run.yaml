# Immutable full-corpus preprocessing for the corrected 20-run SIRHD reporting
# corpus. The run publishes a new DVC object and leaves the generated pointer in
# its immutable publication directory for reviewed promotion to this repository.

run: {}
source: {}
container: {}

workflow:
  kind: preprocess
  target: preprocess

dvc:
  targets:
    - data/files/raw_synthetic_observations_sirhd_reporting_v1_cb6b4e5.zarr.dvc
    - data/files/catalonia_preprocessing_inputs_v1.dvc
    - data/files/sirhd_reporting_v1_cb6b4e5_qa.dvc
  provenance_targets: []

preprocessing:
  base_config: configs/production_only/preprocess_mn5_synth_sirhd_reporting_v1.yaml
  dataset_name: synthetic_sirhd_reporting_v1_cb6b4e5_holt_damped_latent_flow_v2
  expected_run_count: 20
  handoff_manifest: data/files/sirhd_reporting_v1_cb6b4e5_qa/handoff_manifest.json
  required_variables:
    - cases
    - hospitalizations
    - deaths
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true
  float32_variables:
    - cases
    - hospitalizations
    - deaths
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true
  nonnegative_variables:
    - latent_S_true
    - latent_I_true
    - latent_H_true
    - latent_R_true
    - latent_D_true
    - latent_death_flow_true

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 120
