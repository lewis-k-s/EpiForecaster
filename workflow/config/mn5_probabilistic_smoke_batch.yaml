# Batch-QoS fallback for the short Normal-NLL probabilistic smoke when the
# account-level acc_debug submit slot is unavailable. The default smoke remains
# workflow/config/mn5_probabilistic_smoke.yaml on acc_debug.

run: {}
source: {}
container: {}

workflow:
  kind: hpo
  target: hpo

dvc:
  targets:
    - data/files/mobility.zarr.dvc
    - data/processed/real_with_id.zarr.dvc
    - outputs/region_embeddings/region_embeddings.pt.dvc

optuna:
  study_name: epiforecaster_probabilistic_hpo_smoke_v1
  base_config: configs/production_only/train_epifor_mn5_full.yaml
  workers: 1
  trials_per_worker: 1
  timeout_s: 300
  epochs: 1
  max_batches: 1
  seed: 42
  sampler: tpe
  pruning_start_epoch: 10
  search_space: default
  sample_training_loss_objective: false
  overrides:
    - training.run_final_evaluation=false
    - training.compile=false
    - training.loss.joint.observation_loss=nll
    - training.loss.joint.distribution_family=normal

evaluation:
  split: test
  granular: true
  overrides:
    - training.max_batches=1
    - training.compile=false
    - training.val_workers=1
    - training.test_workers=1

promotion:
  root: /gpfs/projects/bsc08/shared_projects/MePreCiSa/EpiForecaster/EpiForecaster-DVC/promoted

resources:
  allocation:
    account: bsc08
    partition: acc
    qos: acc_bscls
    nodes: 1
    tasks: 1
    cpus_per_task: 20
    gres: gpu:1
    runtime: 20
