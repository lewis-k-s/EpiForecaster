schema_version: 1
campaign_id: loss_type_temporal_fit20200918_student_t_crps_v2
stage: ablation
hypothesis: Paired mobility conditions under Student-t df 5 CRPS at temporal fit cutoff
  2020-09-18.
base_config: configs/production_only/train_epifor_mn5_full.yaml
baseline_condition: student_t:crps:mobility_off
fixed_overrides:
  data:
    dataset_path: outputs/loss_research/loss-type-temporal-rolling-v2/real_loss_fit20200918_v2.nc
    region2vec_path: outputs/region_embeddings_no_mobility/region_embeddings.pt
  model:
    cases_dim: 9
    observation_heads:
      kernel_mlp_ww: true
      kernel_mlp_hosp: true
      kernel_mlp_cases: true
      kernel_mlp_deaths: true
  training:
    split_strategy: research
    research_role_manifest_path: configs/research/loss_roles_temporal_fit20200918_v2.json
    research_evaluation_role: calibration
    research_confirmation_enabled: false
    node_split_strategy: random
    crossval_enabled: false
    selection_metric: mean_target_wis
    selection_required_heads:
    - ww
    - hosp
    - cases
    - deaths
    retain_best_crps_checkpoint: true
    batch_size: 8
    gradient_accumulation_steps: 4
    compile: false
    compile_backward: false
    epochs: 50
    max_batches: null
    early_stopping_patience: null
    run_final_evaluation: true
    profiler:
      enabled: false
    plot_forecasts: false
  output:
    save_checkpoints: true
smoke_overrides:
  training:
    compile: false
    num_workers: 1
    val_workers: 1
    test_workers: 1
conditions:
- name: student_t:crps:mobility_off
  hypothesis: Student-t df 5 CRPS changes the distribution family without dynamic
    mobility.
  overrides:
    model:
      type:
        mobility: false
    training:
      loss:
        joint:
          distribution_family: student_t
          distribution_df: 5.0
          observation_loss: crps
  allowed_difference_paths:
  - model.type.mobility
  - training.loss.joint.distribution_family
  - training.loss.joint.distribution_df
  - training.loss.joint.observation_loss
- name: student_t:crps:mobility_on
  hypothesis: Dynamic mobility changes Student-t df 5 CRPS held-out performance.
  overrides:
    model:
      type:
        mobility: true
    training:
      loss:
        joint:
          distribution_family: student_t
          distribution_df: 5.0
          observation_loss: crps
  allowed_difference_paths:
  - model.type.mobility
  - training.loss.joint.distribution_family
  - training.loss.joint.distribution_df
  - training.loss.joint.observation_loss
paired_model_seeds:
- 52
- 53
metrics:
  primary:
    name: mean_target_wis
    direction: minimize
  secondary:
  - wis
  - crps
  - nll
  - abs_error
  safety:
  - covered_50
  - covered_80
  - covered_95
  - width_50
  - width_80
  - width_95
  diagnostic:
  - best_val_selection_value
equal_budget_policy:
  paths:
  - training.epochs
  - training.max_batches
completeness_requirements:
  require_exact_identity_matrix: true
  require_terminal_trials: true
  require_finite_primary_metric: true
  require_full_manifest_folds: false
provenance_requirements:
  require_campaign_sha256: true
  require_output_identity: true
analysis:
  kind: probabilistic_full_coverage
  granular_filename: test_granular.parquet
  required_heads:
  - wastewater
  - hospitalizations
  - cases
  - deaths
  temporal_evaluation:
    scored_role: calibration
    calibration_control: C0
    confirmation: preserved
    confirmation_claim: not_consumed_by_this_campaign
  mobility_context:
    kind: incoming_flow_raw_tertiles
    path: data/files/mobility.zarr
    variable: mobility
    date_start: '2020-05-01'
    date_end: '2021-01-13'
    aggregation: mean_raw_incoming_flow_over_preconfirmation_roles
  evaluation_design: temporal
  temporal_blocks:
  - label_start: '2020-12-17'
    label_end: '2021-01-13'
  region_manifest: configs/crossval/representative_10fold_mobility_refined.json
