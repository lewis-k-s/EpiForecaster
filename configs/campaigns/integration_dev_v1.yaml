schema_version: 1
campaign_id: epiforecaster_integration_dev_v1
stage: ablation
hypothesis: Development screen of mechanistic integration variants on the base-config seed-42 node split. It has no cross-validation folds, so it is development evidence and cannot support model-selection claims.
base_config: configs/production_only/train_epifor_mn5_full.yaml
baseline_condition: real-base
# The campaign ran (idev-campaign-a-20261115) before the 280-target dataset,
# the production scale floors and the censored WIS objective; pin all three.
fixed_overrides:
  data:
    dataset_path: data/processed/real_with_id.zarr.zip
  model:
    observation_heads:
      distribution_scale_floor: 0.001
      count_step_scale_floor_cases: 0.0
      censored_location: false
  training:
    loss:
      joint:
        observation_loss: nll
smoke_overrides:
  training:
    compile: false
    num_workers: 1
    val_workers: 1
    test_workers: 1
init_checkpoints:
  # Reactive n400 SIRHD pretrain, epoch-10 best checkpoint (commit 5a2262d corpus).
  synth-n400-e10: /gpfs/projects/bsc08/shared_projects/MePreCiSa/EpiForecaster/EpiForecaster-DVC/runs/synth-pretrain-5a2262d-n400-e10-20261106/outputs/training/synthetic-pretrain-sirhd-v1-reactive-n400/model/checkpoints/best_model.pt
conditions:
  - name: real-base
    hypothesis: The production configuration trained from scratch on real data is the paired reference.
    overrides: {}
    allowed_difference_paths: []
  - name: real-betaonly
    hypothesis: Fixing every rate except the transmission rate over the horizon, with a smoothness penalty on it, constrains the latent without losing forecast skill.
    overrides: {model: {sir_physics: {time_varying_rates: beta}}, training: {loss: {joint: {beta_smoothness_weight: 10.0}}}}
    allowed_difference_paths: [model.sir_physics.time_varying_rates, training.loss.joint.beta_smoothness_weight]
  - name: real-hist
    hypothesis: Rolling the latent forward over 56 history days and reconstructing the observed history anchors the origin state.
    overrides: {model: {sir_physics: {rollforward_history_steps: 56}}, training: {loss: {joint: {history_reconstruction_weight: 0.5}}}}
    allowed_difference_paths: [model.sir_physics.rollforward_history_steps, training.loss.joint.history_reconstruction_weight]
  - name: real-hospweek
    hypothesis: Summing the latent admission flow over each reporting week matches weekly hospitalization totals.
    overrides: {model: {observation_heads: {hosp_week_total: true}}}
    allowed_difference_paths: [model.observation_heads.hosp_week_total]
  - name: real-renewal
    hypothesis: A renewal force of infection, with cases and wastewater sourced from latent incidence, improves forecasts.
    overrides: {model: {sir_physics: {force_of_infection: renewal}, observation_heads: {cases_source: infection_flow, relevant_source_cases: infection_flow, ww_source: infection_flow, relevant_source_ww: infection_flow}}}
    allowed_difference_paths: [model.sir_physics.force_of_infection, model.observation_heads.cases_source, model.observation_heads.relevant_source_cases, model.observation_heads.ww_source, model.observation_heads.relevant_source_ww]
  - name: real-combo
    hypothesis: History roll-forward, beta-only rates, weekly hospitalization totals, wastewater incidence, and a residual penalty combine.
    overrides:
      model:
        sir_physics: {rollforward_history_steps: 56, time_varying_rates: beta}
        observation_heads: {hosp_week_total: true, ww_source: infection_flow, relevant_source_ww: infection_flow}
      training:
        loss: {joint: {history_reconstruction_weight: 0.5, beta_smoothness_weight: 10.0, residual_penalty_weight: 0.1}}
    allowed_difference_paths: [model.sir_physics.rollforward_history_steps, model.sir_physics.time_varying_rates, model.observation_heads.hosp_week_total, model.observation_heads.ww_source, model.observation_heads.relevant_source_ww, training.loss.joint.history_reconstruction_weight, training.loss.joint.beta_smoothness_weight, training.loss.joint.residual_penalty_weight]
  - name: ft-base
    hypothesis: The fine-tuned production configuration is the paired reference for fine-tuned variants.
    init_checkpoint: synth-n400-e10
    overrides: {}
    allowed_difference_paths: [training.init_checkpoint_path]
  - name: ft-respen100
    hypothesis: A unit-weight penalty on the observation residual norm shifts the forecast onto the mechanistic path.
    init_checkpoint: synth-n400-e10
    overrides: {training: {loss: {joint: {residual_penalty_weight: 1.0}}}}
    allowed_difference_paths: [training.init_checkpoint_path, training.loss.joint.residual_penalty_weight]
# Paired stochastic-training replicates on the base-config split (split_seed 42).
paired_model_seeds: [42, 43, 44, 45, 46]
metrics:
  primary: {name: mean_target_wis, direction: minimize}
  secondary: [mae_median, rmse_median]
  safety: [coverage_ratio]
  diagnostic: [best_val_selection_value]
equal_budget_policy:
  paths: [training.epochs, training.max_batches]
completeness_requirements:
  require_exact_identity_matrix: true
  require_terminal_trials: true
  require_finite_primary_metric: true
provenance_requirements:
  require_campaign_sha256: true
  require_output_identity: true
