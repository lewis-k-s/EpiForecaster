schema_version: 1
campaign_id: epiforecaster_native_ablation_v1
stage: ablation
hypothesis: Paired interventions isolate each declared architectural, loss, signal,
  and delay-kernel choice from the fixed production baseline.
base_config: configs/production_only/train_epifor_mn5_full.yaml
baseline_condition: baseline
fixed_overrides: {}
smoke_overrides:
  training:
    compile: false
    num_workers: 1
    val_workers: 1
    test_workers: 1
conditions:
- name: baseline
  hypothesis: The production configuration is the paired reference.
  overrides: {}
  allowed_difference_paths: []
- name: residual:off
  hypothesis: Observation residual flexibility improves fit beyond mechanistic dynamics.
  overrides:
    model:
      observation_heads:
        residual_scale: 0.0
  allowed_difference_paths:
  - model.observation_heads.residual_scale
- name: kernel:hosp:gamma
  hypothesis: A bounded Gamma hospitalization delay improves over the frozen simplex
    kernel.
  overrides:
    model:
      observation_heads:
        learnable_kernel_hosp: true
        kernel_parameterization_hosp: gamma
  allowed_difference_paths:
  - model.observation_heads.kernel_parameterization_hosp
  - model.observation_heads.learnable_kernel_hosp
- name: kernel:cases:gamma
  hypothesis: A bounded Gamma reporting delay improves over the learnable simplex
    kernel.
  overrides:
    model:
      observation_heads:
        kernel_parameterization_cases: gamma
  allowed_difference_paths:
  - model.observation_heads.kernel_parameterization_cases
- name: kernel:deaths:gamma
  hypothesis: A bounded Gamma death-reporting delay improves over the learnable simplex
    kernel.
  overrides:
    model:
      observation_heads:
        kernel_parameterization_deaths: gamma
  allowed_difference_paths:
  - model.observation_heads.kernel_parameterization_deaths
- name: kernel:clinical:gamma
  hypothesis: Bounded Gamma clinical delays improve over the baseline clinical simplex
    kernels.
  overrides:
    model:
      observation_heads:
        learnable_kernel_hosp: true
        kernel_parameterization_hosp: gamma
        kernel_parameterization_cases: gamma
        kernel_parameterization_deaths: gamma
  allowed_difference_paths:
  - model.observation_heads.kernel_parameterization_hosp
  - model.observation_heads.kernel_parameterization_cases
  - model.observation_heads.kernel_parameterization_deaths
  - model.observation_heads.learnable_kernel_hosp
- name: mobility:off
  hypothesis: Native OD context contributes to forecasts.
  overrides:
    native:
      mobility_enabled: false
  allowed_difference_paths:
  - native.mobility_enabled
- name: vaccination:off
  hypothesis: Vaccination histories contribute to forecasts.
  overrides:
    native:
      include_vaccination: false
  allowed_difference_paths:
  - native.include_vaccination
- name: loss:nll
  hypothesis: NLL changes calibration relative to Student-t CRPS.
  overrides:
    training:
      loss:
        joint:
          observation_loss: nll
  allowed_difference_paths:
  - training.loss.joint.observation_loss
paired_model_seeds:
- 42
- 43
cross_validation:
  fold_indices:
  - 1
  - 4
  - 5
  smoke_fold_indices:
  - 1
  - 4
  num_folds: 10
metrics:
  primary:
    name: mean_target_wis
    direction: minimize
  secondary: []
  safety: []
  diagnostic:
  - best_val_selection_value
equal_budget_policy:
  paths:
  - training.epochs
  - training.max_batches
completeness_requirements:
  require_exact_identity_matrix: true
  require_terminal_trials: true
  require_finite_primary_metric: true
provenance_requirements:
  require_campaign_sha256: true
  require_output_identity: true
