schema_version: 1
campaign_id: loss_type_spatial_rolling90_10epoch_smoke_v1
stage: ablation_smoke
hypothesis: Bounded ten-epoch mobility-on training check with a wider spatial target
  cohort.
base_config: configs/production_only/train_epifor_mn5_full.yaml
baseline_condition: normal:crps:mobility_on
fixed_overrides:
  data:
    dataset_path: outputs/loss_research/loss-type-spatial-rolling90-v1/real_loss_spatial_rolling90_v1.nc
    region2vec_path: outputs/region_embeddings_no_mobility/region_embeddings.pt
  model:
    cases_dim: 9
    observation_heads:
      kernel_mlp_ww: true
      kernel_mlp_hosp: true
      kernel_mlp_cases: true
      kernel_mlp_deaths: true
  training:
    split_strategy: node
    node_split_strategy: crossval
    crossval_enabled: true
    crossval_manifest_path: configs/crossval/spatial_rolling90_10fold_v1.json
    crossval_num_folds: 10
    crossval_holdout_role: test
    selection_metric: mean_target_wis
    selection_required_heads:
    - ww
    - hosp
    - cases
    - deaths
    retain_best_crps_checkpoint: true
    epochs: 10
    max_batches: null
    early_stopping_patience: 10
    run_final_evaluation: true
    profiler:
      enabled: false
    plot_forecasts: false
  output:
    save_checkpoints: true
smoke_overrides:
  training:
    compile: false
    num_workers: 1
    val_workers: 1
    test_workers: 1
    epochs: 10
    max_batches: null
    early_stopping_patience: 10
conditions:
- name: normal:crps:mobility_on
  hypothesis: Dynamic mobility changes Normal CRPS held-out performance.
  overrides:
    model:
      type:
        mobility: true
    training:
      loss:
        joint:
          distribution_family: normal
          distribution_df: 5.0
          observation_loss: crps
  allowed_difference_paths:
  - model.type.mobility
  - training.loss.joint.distribution_family
  - training.loss.joint.distribution_df
  - training.loss.joint.observation_loss
paired_model_seeds:
- 52
cross_validation:
  split_manifest: configs/crossval/spatial_rolling90_10fold_v1.json
  fold_indices:
  - 0
  smoke_fold_indices:
  - 0
metrics:
  primary:
    name: wis_median
    direction: minimize
  secondary:
  - wis
  - crps
  - nll
  - abs_error
  safety:
  - covered_50
  - covered_80
  - covered_95
  - width_50
  - width_80
  - width_95
  diagnostic:
  - best_val_selection_value
equal_budget_policy:
  paths:
  - training.epochs
  - training.max_batches
completeness_requirements:
  require_exact_identity_matrix: true
  require_terminal_trials: true
  require_finite_primary_metric: true
  require_full_manifest_folds: false
provenance_requirements:
  require_campaign_sha256: true
  require_output_identity: true
