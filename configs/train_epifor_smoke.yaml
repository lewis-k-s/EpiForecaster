# Bounded local acceptance config. Substantive EpiForecaster training runs on MN5
# through the immutable Snakemake workflow.

data:
  dataset_path: data/processed/real_with_id.zarr
  region2vec_path: outputs/region_embeddings/region_embeddings.pt
  use_valid_targets: true
  mobility_min_flow_raw: 10.0
  mobility_weight_clip_max: 8.0
  min_history_observed_fraction: 0.5
  min_horizon_observed_fraction: 0.5
  window_stride: 1
  sample_ordering: time

model:
  type:
    cases: true
    regions: true
    biomarkers: true
    mobility: true
  params:
    mobility_embedding_dim: 16
    region_embedding_dim: 64
    include_day_of_week: true
    include_holidays: true
    include_lockdown_severity: true
    include_vaccination: true
    gnn_module: gcn
    input_window_length: 60
    forecast_horizon: 28
    max_neighbors: 20
    gnn_depth: 2
    sir_physics:
      dt: 1.0
      enforce_nonnegativity: true
      enforce_mass_conservation: true
      beta_min: 0.01
      beta_max: 2.0
      gamma_min: 0.05
      gamma_max: 0.5
      mortality_min: 0.0001
      mortality_max: 0.05
      residual_clip: 10000.0

output:
  experiment_name: local_smoke
  log_dir: outputs/training
  write_granular_eval: false

training:
  seed: 42
  split_seed: 42
  device: cpu
  init_checkpoint_path: null
  batch_size: 2
  gradient_accumulation_steps: 1
  gradient_clip_value: 5.0
  warmup_steps: 0
  early_stopping_patience: null
  nan_loss_patience: 3
  epochs: 1
  max_batches: 10
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  num_workers: 1
  val_workers: 1
  test_workers: 1
  persistent_workers: false
  prefetch_factor: 1
  split_strategy: node
  node_split_strategy: stratified
  node_split_population_bins: 5
  val_split: 0.2
  test_split: 0.1
  profiler:
    enabled: false
  plot_forecasts: false
  enable_mixed_precision: false
  loss:
    name: joint_inference
    joint:
      adaptive_scheme: none
      gradnorm_obs_weight_sum: 0.95
      gradnorm_update_every: 16
      gradnorm_ema_decay: 0.9
      gradnorm_probe: obs_context
      w_sird_supervision: 0.0
