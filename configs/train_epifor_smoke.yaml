# Default bounded local acceptance config for source-native clinical training.
# Substantive EpiForecaster training runs on MN5 through the immutable
# Snakemake workflow; this config is a tiny CPU smoke run over the real
# native-support artifacts (data/processed/native_support). Selected inside
# `uv run train epiforecaster --config configs/train_epifor_smoke.yaml`
# via the additive native.enabled branch (no separate CLI subcommand).

native:
  enabled: true
  root: data/processed/native_support
  spatial_encoder: pooled
  od_source: mitma
  overlap_weighting: geostat_grid
  od_self_flows: retain
  od_min_flow_raw: 10.0
  head_balanced_sampling: true
  confirmation_guard: true

data:
  dataset_path: data/processed/real_with_id.zarr
  min_history_observed_fraction: 0.5
  min_horizon_observed_fraction: 0.5
  window_stride: 1

model:
  type:
    cases: false
    regions: false
    biomarkers: false
    mobility: false
  params:
    # Required ModelConfig fields; variant features are unused in native
    # mode (NativeForecasterConfig builds a minimal base internally).
    mobility_embedding_dim: 16
    region_embedding_dim: 8
    max_neighbors: 20
    input_window_length: 28
    forecast_horizon: 14
    head_d_model: 48
    head_n_heads: 2
    head_num_layers: 1
    head_dropout: 0.1
    sir_physics:
      dt: 1.0
      enforce_nonnegativity: true
      enforce_mass_conservation: true
      beta_min: 0.01
      beta_max: 2.0
      gamma_min: 0.05
      gamma_max: 0.5
      mortality_min: 0.0001
      mortality_max: 0.05
      residual_clip: 10000.0

output:
  experiment_name: native_smoke
  log_dir: outputs/training
  write_granular_eval: false

training:
  seed: 42
  split_seed: 42
  device: cpu
  batch_size: 16
  epochs: 2
  max_batches: 8
  learning_rate: 0.0005
  optimizer: adamw
  weight_decay: 1.0e-05
  scheduler_type: cosine
  warmup_steps: 0
  min_learning_rate: 0.0
  gradient_clip_value: 5.0
  early_stopping_patience: null
  val_split: 0.1
  num_workers: 0
  val_workers: 0
  persistent_workers: false
  prefetch_factor: 1
  plot_forecasts: false
  enable_mixed_precision: false
  loss:
    name: joint_inference
    joint:
      observation_loss: nll
      adaptive_scheme: none
      latent:
        total_weight: 0.0
