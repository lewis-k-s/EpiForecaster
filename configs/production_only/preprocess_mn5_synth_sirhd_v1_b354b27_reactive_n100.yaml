# Closed-loop reactive SIRHD corpus for synthetic latent-supervision pretraining:
# epiforecaster_sirhd_v1_netcdf_b354b27_20261015_reactive_n100 (200 runs:
# 100 Reactive profiles + 100 no-policy Baseline twins, 945 regions).
#
# Same 200 simulations as d9c5bae, re-merged by EpiSim.jl b354b27 with
# factorized mobility (mobility_base_edges + npi_mobility_reduction, rule
# max_endpoint_self_loop v1), handoff manifests and per-run sparsity. It
# replaces the d9c5bae dataset identity. SyntheticProcessor rebuilds mobility
# from the factorized layout and checks parity against mobility_time_varying.
#
# Generator QA: qa_passed=false. The EpiSim owner accepted the two failed gates
# incidence_p90_over_p10 (5.25 < 8) and policy_release_fraction (0.479 < 0.5)
# on 2026-10-18 (qa_acceptance.json). The workflow honours the waiver only for
# exactly these gates and this handoff manifest SHA-256.

base_config: "preprocess_mn5_synth.yaml"

env: "mn5"
synthetic_path: "data/files/epiforecaster_sirhd_v1_netcdf_b354b27_reactive_n100.nc"
