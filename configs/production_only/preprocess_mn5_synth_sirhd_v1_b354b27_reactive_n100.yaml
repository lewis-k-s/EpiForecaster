# The corpus starts on 2020-02-09. sirhd_death_flow is destination-dated, so its
# first interval ends on 2020-02-10; the first corpus date has no death-flow
# target and is excluded rather than filled.
start_date: "2020-02-10"
end_date: "2021-05-09"
dataset_name: "synthetic_sirhd_v1_b354b27_reactive_n100_holt_damped"
