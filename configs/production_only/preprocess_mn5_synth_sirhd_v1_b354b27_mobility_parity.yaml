# Bounded mobility layout QA for the b354b27 reactive corpus. It runs the full
# SyntheticProcessor path on all 200 runs over a 60-day window and widens the
# parity sample to every run and 20 dates. The window lies inside the first
# 128-date chunk of mobility_time_varying (2020-02-09..2020-06-15), so each run
# decompresses one dense chunk, and it covers the reactive restriction period.
#
# The output dataset is QA evidence only. The workflow target preprocess_qa
# does not publish it.

base_config: "preprocess_mn5_synth_sirhd_v1_b354b27_reactive_n100.yaml"

start_date: "2020-03-20"
end_date: "2020-05-18"
dataset_name: "synthetic_sirhd_v1_b354b27_mobility_parity_qa"

synthetic_mobility_parity_runs: 200
synthetic_mobility_parity_dates: 20
