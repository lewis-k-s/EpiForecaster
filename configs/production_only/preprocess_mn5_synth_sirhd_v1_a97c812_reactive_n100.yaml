# Closed-loop reactive SIRHD corpus for synthetic latent-supervision pretraining:
# epiforecaster_sirhd_v1_zarr_a97c812_20261027_reactive_n100 (200 runs:
# 100 Reactive profiles + 100 no-policy Baseline twins, 945 regions).
#
# EpiSim.jl a97c812 regenerated all 200 simulations with the seed cap
# max_seed_half_region_population v1 (2 runs capped), so profile 13 no longer
# seeds more infected than people and no run is excluded. It replaces the
# b354b27 NetCDF dataset identity.
#
# The raw corpus is packed sharded Zarr (episim-raw-zarr-v1, lossless). It
# stores only the factorized mobility (mobility_base_edges +
# npi_mobility_reduction, rule max_endpoint_self_loop v1); the dense
# mobility_time_varying is omitted. SyntheticProcessor rebuilds mobility from
# the factorized layout and checks the row sums. EpiSim checked the rebuild
# against the run source files on all 200 runs (max error 0.0).
#
# Generator QA: qa_passed=false. The EpiSim owner accepted the two failed gates
# incidence_p90_over_p10 (5.25 < 8) and policy_release_fraction (0.479 < 0.5)
# on 2026-10-27 (qa_acceptance.json). The workflow honours the waiver only for
# exactly these gates and this handoff manifest SHA-256.

base_config: "preprocess_mn5_synth.yaml"

env: "mn5"
synthetic_path: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
cases_file: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
mobility_path: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
wastewater_file: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
population_file: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
region_metadata_file: "data/files/catalonia_preprocessing_inputs_v1/edar_muni_edges.nc"

# The corpus starts on 2020-02-09. sirhd_death_flow is destination-dated, so its
# first interval ends on 2020-02-10; the first corpus date has no death-flow
# target and is excluded rather than filled.
start_date: "2020-02-10"
end_date: "2021-05-09"
dataset_name: "synthetic_sirhd_v1_a97c812_reactive_n100_holt_damped"
vaccination_file: null
continuous_storage_dtype: "float32"
# The trainer casts mobility to float16 (10 mantissa bits), so rounding the
# stored float32 mobility to 10 bits keeps what the model sees. The float32
# exponent range stays, so small positive flows are not set to zero. See
# docs/SYNTHETIC_ZARR_LAYOUT.md.
bitround_keepbits:
  mobility: 10

synthetic_state_space_schema_version: "epiforecaster_sirhd_v1"
synthetic_state_space_contract_sha256: "d8837d63a35a36c1d095184d58c622880b78c5f4ee85d83370c9e9dac6ffe582"

temporal_covariates:
  holiday_calendar_file: "data/files/catalonia_preprocessing_inputs_v1/catalonia_holidays.csv"

smoothing:
  clinical_method: "holt_damped"

source_provenance:
