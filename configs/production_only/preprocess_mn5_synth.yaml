# Preprocessing configuration for synthetic epidemiological data
#
# Synthetic data is generated by EpiSim.jl and bundled in a single packed
# sharded Zarr store with all variables. Use SyntheticProcessor to extract components.
#
# Key difference from real data: synthetic uses concentration mode because
# it contains pre-computed concentrations without flow_rate information.

# All synthetic data comes from the single bundled Zarr store
data_dir: "data/files"
synthetic_path: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
# Individual paths are not used when synthetic_path is set, but required by config
cases_file: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
mobility_path: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
wastewater_file: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
population_file: "data/files/epiforecaster_sirhd_v1_zarr_a97c812_reactive_n100.zarr.zip"
region_metadata_file: "data/files/edar_muni_edges.nc"

# Hospitalizations and deaths come from the same Zarr bundle when synthetic_path
# is set.

# Vaccination data (real-world Catalonia coverage; will be zero-filled for pre-vaccine date ranges)
vaccination_file: "data/files/vaccination_municipality.csv"

# Temporal processing parameters - match synthetic data range
start_date: "2020-02-09"
end_date: "2020-06-01"

# Feature processing options
# IMPORTANT: Synthetic data MUST use concentration mode
wastewater_flow_mode: "concentration"

# Region filtering
min_density_threshold: 0.01 # Low threshold for synthetic data

# Output configuration
output_path: "data/processed"
dataset_name: "synthetic_full"
compression: "blosc"

# Alignment and validation options
alignment_strategy: "interpolate"
target_dataset: "cases"
crop_datasets: true
validate_alignment: true
generate_alignment_report: true

# Processing configuration
num_workers: 4
chunk_size: 365
run_id_chunk_size: 1
date_chunk_size: 30 # Chunk size for date dimension in zarr output
mobility_chunk_size: 100 # Chunk size for spatial dims (origin/destination)
memory_limit_gb: 100.0

# Temporal covariates - must match real data preprocessing for curriculum training
temporal_covariates:
  include_day_of_week: true
  include_holidays: true
  include_lockdown_severity: true
  holiday_calendar_file: data/files/catalonia_holidays.csv

# Graph construction options
graph_options:
  edge_strategy: "knn"
  k_neighbors: 8
  distance_threshold: 50.0
  include_self_loops: false

# Validation and quality control options
validation_options:
  max_missing_percentage: 0.5 # Higher tolerance for synthetic
  min_data_coverage: 0.5
  outlier_detection: false # Synthetic data is clean
  outlier_threshold: 3.0
  temporal_consistency_check: true
  spatial_consistency_check: true
  generate_plots: false
