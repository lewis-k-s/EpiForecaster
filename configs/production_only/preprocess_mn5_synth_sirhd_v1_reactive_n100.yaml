# Closed-loop reactive SIRHD corpus for synthetic latent-supervision pretraining:
# epiforecaster_sirhd_v1_netcdf_d9c5bae_20261015_reactive_n100 (200 runs:
# 100 Reactive profiles + 100 no-policy Baseline twins, 945 regions).
#
# This is a new immutable dataset identity. Latent targets come from the
# generator's model-aligned sirhd_* partition (sirhd_I = E+A+I+PH+PD), not from
# the primitive latent_*_true audit stocks.

