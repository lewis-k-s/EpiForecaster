dataset_name: "synthetic_netcdf_smoke_2run_sirhd_partition"
vaccination_file: null
continuous_storage_dtype: "float32"

synthetic_state_space_schema_version: "epiforecaster_sirhd_v1"
synthetic_state_space_contract_sha256: "d8837d63a35a36c1d095184d58c622880b78c5f4ee85d83370c9e9dac6ffe582"

temporal_covariates:
