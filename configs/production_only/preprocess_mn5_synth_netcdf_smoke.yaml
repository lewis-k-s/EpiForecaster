# Smoke validation config for NetCDF4 raw synthetic input.
# Uses the 5-run dense smoke corpus from the upstream NetCDF cutover.

base_config: "preprocess_mn5_synth.yaml"

env: "mn5"
synthetic_path: "data/files/epiforecaster_sirhd_v1_netcdf_c3d4810_smoke_2run.nc"
cases_file: "data/files/epiforecaster_sirhd_v1_netcdf_c3d4810_smoke_2run.nc"
mobility_path: "data/files/epiforecaster_sirhd_v1_netcdf_c3d4810_smoke_2run.nc"
wastewater_file: "data/files/epiforecaster_sirhd_v1_netcdf_c3d4810_smoke_2run.nc"
